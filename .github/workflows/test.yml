name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Ubuntu build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y opam build-essential pkg-config bubblewrap m4 rsync git curl ca-certificates patch unzip tar gzip bzip2 xz-utils diffutils libffi-dev libcurl4-openssl-dev libmp3lame-dev libssl-dev zlib1g-dev gnupg nasm ffmpeg
      - name: Verify the original Ubuntu FFmpeg
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          test "$(ffmpeg -version | head -n1 | cut -d' ' -f3 | cut -d. -f1)" = 4
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install opam pkg-config libffi xz gnupg lame openssl@3 zlib curl
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Validate the managed installer
        shell: bash
        env:
          LIQUIDSOAP_CI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/install-liquidsoap.js "$RUNNER_TEMP/radio-installer"
          if [ "$RUNNER_OS" = Linux ]; then
            node .github/scripts/install-shoutcast.js "$RUNNER_TEMP/radio-installer"
          fi
      - name: Run tests
        run: node --test --test-reporter=tap
      - name: Repeat native playback regressions
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2; do
            node --test --test-reporter=tap tests/autodj-playlist.test.js tests/autodj-reconnect.test.js tests/playlist-schedule-runtime.test.js
          done
      - name: Confirm the system FFmpeg was not replaced
        if: runner.os == 'Linux'
        shell: bash
        run: test "$(ffmpeg -version | head -n1 | cut -d' ' -f3 | cut -d. -f1)" = 4

  freebsd:
    name: FreeBSD / Linuxulator
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1
        env:
          LIQUIDSOAP_CI_GITHUB_TOKEN: ${{ github.token }}
        with:
          envs: 'LIQUIDSOAP_CI_GITHUB_TOKEN'
          release: '14.4'
          mem: 4096
          cpu: 2
          copyback: false
          prepare: |
            set -eu
            sysrc linux_enable="YES"
            service linux start
            pkg install -y linux_base-rl9 node22 ocaml-opam bash curl pkgconf gmake git rsync m4 unzip libffi libsysinfo ca_root_nss gnupg nasm lame openssl
            pw useradd radio-test -m -s /bin/sh
          run: |
            set -eu
            cp -R . /home/radio-test/radioserver
            chown -R radio-test:radio-test /home/radio-test/radioserver
            printf '%s\n' "$LIQUIDSOAP_CI_GITHUB_TOKEN" | su -l radio-test -c '
              set -eu
              IFS= read -r LIQUIDSOAP_CI_GITHUB_TOKEN
              export LIQUIDSOAP_CI_GITHUB_TOKEN
              cd /home/radio-test/radioserver
              node .github/scripts/install-shoutcast.js /home/radio-test/radio-runtime
              export SHOUTCAST_TEST_BIN=/home/radio-test/radio-runtime/bin/shoutcast/freebsd-x64/sc_serv
              (unset LIQUIDSOAP_CI_GITHUB_TOKEN; node --test --test-reporter=tap tests/shoutcast-runtime.test.js)
              node .github/scripts/install-liquidsoap.js /home/radio-test/radio-runtime
              unset LIQUIDSOAP_CI_GITHUB_TOKEN
              export LIQUIDSOAP_TEST_BIN=/home/radio-test/radio-runtime/bin/liquidsoap/freebsd-x64/runtime/liquidsoap
              "$LIQUIDSOAP_TEST_BIN" --version
              node --test --test-reporter=tap
              for iteration in 1 2; do
                node --test --test-reporter=tap tests/autodj-playlist.test.js tests/autodj-reconnect.test.js tests/playlist-schedule-runtime.test.js
              done
            '

  fedora:
    name: Native / Fedora 44
    # This runner only hosts the Fedora VM; tests run inside Fedora.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1
        with:
          version: v2.2.0
      - name: Start Fedora and install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          limactl start --plain --name=radio-fedora --cpus=2 --memory=4 --disk=30 --tty=false template:fedora-44
          ssh lima-radio-fedora sudo dnf install -y --allowerasing nodejs npm opam gcc gcc-c++ make pkgconf-pkg-config m4 rsync git bubblewrap curl ca-certificates patch unzip tar gzip bzip2 xz diffutils libcurl-devel libffi-devel lame-devel openssl-devel zlib-devel gnupg2 nasm procps-ng
          rsync -a --exclude=.git --exclude=bin --exclude=.run --exclude=logs ./ lima-radio-fedora:radioserver/
      - name: Validate the managed installer and native playback on Fedora
        shell: bash
        env:
          LIQUIDSOAP_CI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
          printf '%s\n' "$LIQUIDSOAP_CI_GITHUB_TOKEN"
          cat <<'FEDORA'
          cd "$HOME/radioserver"
          test "$(. /etc/os-release; echo "$ID:$VERSION_ID")" = fedora:44
          node .github/scripts/install-liquidsoap.js "$HOME/radio-runtime"
          unset LIQUIDSOAP_CI_GITHUB_TOKEN
          export LIQUIDSOAP_TEST_BIN="$HOME/radio-runtime/bin/liquidsoap/linux-x64/runtime/liquidsoap"
          "$LIQUIDSOAP_TEST_BIN" --version
          node --test --test-reporter=tap
          for iteration in 1 2; do
            node --test --test-reporter=tap tests/autodj-playlist.test.js tests/autodj-reconnect.test.js tests/playlist-schedule-runtime.test.js
          done
          FEDORA
          } | ssh lima-radio-fedora 'IFS= read -r LIQUIDSOAP_CI_GITHUB_TOKEN; export LIQUIDSOAP_CI_GITHUB_TOKEN; exec bash -se'
      - name: Stop the Fedora VM
        if: always()
        shell: bash
        run: |
          if command -v limactl >/dev/null 2>&1; then
            limactl stop --force radio-fedora
          fi
