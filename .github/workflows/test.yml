name: Tests

on:
  push:
    branches: [main, codex/autodj-schedule-validation, codex/latest-liquidsoap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Liquidsoap on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=liquidsoap_2.4.5-ubuntu-noble-ocaml4.14.2-2_amd64.deb
          curl --fail --location --retry 3 "https://github.com/savonet/liquidsoap-release-assets/releases/download/v2.4.5/$package" -o "$RUNNER_TEMP/$package"
          echo "1e0233bf152baffdaa0fb61d8c86d4879cab440d5310711242897b9bc739b943  $RUNNER_TEMP/$package" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/$package"
          echo "LIQUIDSOAP_TEST_BIN=$(command -v liquidsoap)" >> "$GITHUB_ENV"
          echo "LIQUIDSOAP_TEST_RESOURCES=/usr/share/liquidsoap" >> "$GITHUB_ENV"
      - name: Install Liquidsoap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'liquidsoap-test'
          $archive = Join-Path $env:RUNNER_TEMP 'liquidsoap-2.4.5-win64.zip'
          Invoke-WebRequest 'https://github.com/savonet/liquidsoap-release-assets/releases/download/v2.4.5/liquidsoap-2.4.5-win64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '17c29c9f662db11ced6b85e807f6038e15e32b76f30f9695506905879a43f4b6') { throw 'Liquidsoap checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          "LIQUIDSOAP_TEST_BIN=$(Join-Path $runtime 'liquidsoap-2.4.5-win64/liquidsoap.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Liquidsoap on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install liquidsoap
          echo "LIQUIDSOAP_TEST_BIN=$(command -v liquidsoap)" >> "$GITHUB_ENV"
      - name: Verify native test runtime
        shell: bash
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const {parseVersion,versionIsSupported}=require("./app/autodj-manager"); const output=execFileSync(process.env.LIQUIDSOAP_TEST_BIN,["--version"],{encoding:"utf8"}); console.log(output); const version=parseVersion(output); if(!version || !versionIsSupported(version,[2,4,5])) process.exit(1);'
      - name: Validate the managed installer
        if: runner.os != 'macOS'
        shell: bash
        run: node .github/scripts/install-liquidsoap.js "$RUNNER_TEMP/radio-installer"
      - name: Run tests
        run: node --test --test-reporter=tap
      - name: Repeat native playback regressions
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2; do
            node --test --test-reporter=tap tests/autodj-playlist.test.js tests/autodj-reconnect.test.js tests/playlist-schedule-runtime.test.js
          done

  freebsd:
    name: Native / FreeBSD
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1
        with:
          release: '14.4'
          mem: 4096
          cpu: 2
          copyback: false
          prepare: |
            pkg install -y node22 ocaml-opam ffmpeg curl pkgconf gmake git rsync m4 libffi libsysinfo ca_root_nss
            pw useradd radio-test -m -s /bin/sh
          run: |
            set -eu
            cp -R . /home/radio-test/radioserver
            chown -R radio-test:radio-test /home/radio-test/radioserver
            su -l radio-test -c '
              set -eu
              cd /home/radio-test/radioserver
              node .github/scripts/install-liquidsoap.js /home/radio-test/radio-runtime
              export LIQUIDSOAP_TEST_BIN=/home/radio-test/radio-runtime/bin/liquidsoap/freebsd-x64/liquidsoap
              "$LIQUIDSOAP_TEST_BIN" --version
              node --test --test-reporter=tap
              for iteration in 1 2; do
                node --test --test-reporter=tap tests/autodj-playlist.test.js tests/autodj-reconnect.test.js tests/playlist-schedule-runtime.test.js
              done
            '

  source:
    name: Official source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential pkg-config bubblewrap m4 rsync git libffi-dev libcurl4-openssl-dev libmp3lame-dev ffmpeg libavutil-dev libavformat-dev libavcodec-dev libavdevice-dev libavfilter-dev libswresample-dev libswscale-dev
      - name: Reject obsolete libraries, then build compatible FFmpeg libraries
        if: runner.os == 'Linux'
        run: |
          node -e 'require("node:assert/strict").throws(() => require("./app/liquidsoap-opam").prerequisites(require("./app/platform").resolveProfile()), /FFmpeg 7 or newer/);'
          bash .github/scripts/build-ffmpeg.sh
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install opam ffmpeg pkg-config libffi
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Install the latest official Liquidsoap
        run: node .github/scripts/install-liquidsoap.js "$RUNNER_TEMP/radio-installer"
      - name: Validate native playback with the compiled runtime
        run: node --test --test-reporter=tap tests/liquidsoap-runtime.test.js tests/autodj-playlist.test.js tests/autodj-reconnect.test.js tests/playlist-schedule-runtime.test.js
